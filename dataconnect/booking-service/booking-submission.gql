# Dynamic batch `_Data` variables are currently unsupported by the generated
# JavaScript SDK, so these operations live in a server-only connector without
# SDK generation. Top-level entities use stable scalar variables because the
# Data Connect compatibility checker repeatedly reports unchanged `_Data`
# object signatures as breaking changes. Batch arrays remain schema validated.

mutation CreateCompleteBookingFromCallable(
  $bookingId: UUID!
  $eventId: UUID!
  $bookerId: String!
  $clientSubmissionKey: String!
  $revisionGroupId: UUID!
  $revisionNumber: Int!
  $supersedesBookingId: UUID
  $status: BookingStatus!
  $approvalStatus: BookingApprovalStatus!
  $sitNextToUserIds: [String!]
  $accommodationRequested: Boolean!
  $accommodationNote: String
  $createdBy: String!
  $updatedBy: String!
  $bookingPlaces: [BookingPlace_Data!]! @allow(fields: "id eventId bookerId createdBy updatedBy", maxCount: 100)
  $bookingLines: [BookingLine_Data!]! @allow(fields: "id bookingPlaceId bookingId ticketTypeId guestUserId guestDisplayName dietaryNote sortOrder createdBy updatedBy", maxCount: 100)
) @auth(level: NO_ACCESS) @transaction {
  booking_insert(data: {
    id: $bookingId
    eventId: $eventId
    bookerId: $bookerId
    clientSubmissionKey: $clientSubmissionKey
    revisionGroupId: $revisionGroupId
    revisionNumber: $revisionNumber
    supersedesBookingId: $supersedesBookingId
    status: $status
    approvalStatus: $approvalStatus
    sitNextToUserIds: $sitNextToUserIds
    accommodationRequested: $accommodationRequested
    accommodationNote: $accommodationNote
    createdBy: $createdBy
    updatedBy: $updatedBy
  })
  bookingPlace_insertMany(data: $bookingPlaces)
  bookingLine_insertMany(data: $bookingLines)
}

mutation CreateActiveBookingRevisionFromCallable(
  $bookingId: UUID!
  $eventId: UUID!
  $bookerId: String!
  $clientSubmissionKey: String!
  $revisionGroupId: UUID!
  $revisionNumber: Int!
  $supersedesBookingId: UUID
  $status: BookingStatus!
  $approvalStatus: BookingApprovalStatus!
  $sitNextToUserIds: [String!]
  $accommodationRequested: Boolean!
  $accommodationNote: String
  $createdBy: String!
  $updatedBy: String!
  $bookingPlaces: [BookingPlace_Data!]! @allow(fields: "id eventId bookerId createdBy updatedBy", maxCount: 100)
  $bookingLines: [BookingLine_Data!]! @allow(fields: "id bookingPlaceId bookingId ticketTypeId guestUserId guestDisplayName dietaryNote sortOrder createdBy updatedBy", maxCount: 100)
  $supersededBookingId: UUID!
  $deltaAmountMinor: Int!
  $adjustmentStatus: BookingPaymentAdjustmentStatus!
  $orchestrationKey: String!
) @auth(level: NO_ACCESS) @transaction {
  booking_insert(data: {
    id: $bookingId
    eventId: $eventId
    bookerId: $bookerId
    clientSubmissionKey: $clientSubmissionKey
    revisionGroupId: $revisionGroupId
    revisionNumber: $revisionNumber
    supersedesBookingId: $supersedesBookingId
    status: $status
    approvalStatus: $approvalStatus
    sitNextToUserIds: $sitNextToUserIds
    accommodationRequested: $accommodationRequested
    accommodationNote: $accommodationNote
    createdBy: $createdBy
    updatedBy: $updatedBy
  })
  bookingPlace_insertMany(data: $bookingPlaces)
  bookingLine_insertMany(data: $bookingLines)
  retired: booking_updateMany(
    where: {
      revisionGroupId: { eq: $revisionGroupId }
      id: { ne: $bookingId }
      supersededAt: { isNull: true }
    }
    data: {
      supersededAt_expr: "request.time"
      updatedAt_expr: "request.time"
      updatedBy: "system"
    }
  ) @check(expr: "this >= 1", message: "BOOKING_REVISION_CONFLICT")
  bookingPaymentAdjustment_upsert(
    data: {
      revisionBookingId: $bookingId
      supersededBookingId: $supersededBookingId
      deltaAmountMinor: $deltaAmountMinor
      status: $adjustmentStatus
      orchestrationKey: $orchestrationKey
      createdBy: "system"
      updatedBy: "system"
    }
  )
}

mutation CreatePendingBookingRevisionFromCallable(
  $bookingId: UUID!
  $eventId: UUID!
  $bookerId: String!
  $clientSubmissionKey: String!
  $revisionGroupId: UUID!
  $revisionNumber: Int!
  $supersedesBookingId: UUID!
  $status: BookingStatus!
  $approvalStatus: BookingApprovalStatus!
  $sitNextToUserIds: [String!]
  $accommodationRequested: Boolean!
  $accommodationNote: String
  $createdBy: String!
  $updatedBy: String!
  $bookingPlaces: [BookingPlace_Data!]! @allow(fields: "id eventId bookerId createdBy updatedBy", maxCount: 100)
  $bookingLines: [BookingLine_Data!]! @allow(fields: "id bookingPlaceId bookingId ticketTypeId guestUserId guestDisplayName dietaryNote sortOrder createdBy updatedBy", maxCount: 100)
) @auth(level: NO_ACCESS) @transaction {
  booking_insert(data: {
    id: $bookingId
    eventId: $eventId
    bookerId: $bookerId
    clientSubmissionKey: $clientSubmissionKey
    revisionGroupId: $revisionGroupId
    revisionNumber: $revisionNumber
    supersedesBookingId: $supersedesBookingId
    status: $status
    approvalStatus: $approvalStatus
    sitNextToUserIds: $sitNextToUserIds
    accommodationRequested: $accommodationRequested
    accommodationNote: $accommodationNote
    createdBy: $createdBy
    updatedBy: $updatedBy
  })
  bookingPlace_insertMany(data: $bookingPlaces)
  bookingLine_insertMany(data: $bookingLines)
  booking_updateMany(
    where: {
      id: { eq: $supersedesBookingId }
      approvalStatus: { in: [PENDING, REJECTED] }
      supersededAt: { isNull: true }
    }
    data: {
      supersededAt_expr: "request.time"
      updatedAt_expr: "request.time"
      updatedBy: "system"
    }
  )
}

# Approving an amended revision activates it, retires the previous active
# revision, and records its payment delta in one transaction. Replays cannot
# make a second decision because the reviewed row must still be PENDING.
mutation ActivateApprovedBookingRevisionFromCallable(
  $bookingId: UUID!
  $revisionGroupId: UUID!
  $activeBookingId: UUID!
  $reviewedById: String!
  $actorSecurityVersion: Int!
  $actorIsAdmin: Boolean!
  $approvalNote: String
  $deltaAmountMinor: Int!
  $adjustmentStatus: BookingPaymentAdjustmentStatus!
  $orchestrationKey: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    currentAuthorization: userSecurityState(key: {userId: $reviewedById})
      @check(expr: "this != null && this.accessReady == true && this.syncStatus == 'READY' && this.membershipStatus == this.user.membershipStatus && this.membershipStatus in ['REGULAR','RETIRED','RESERVE','INDUSTRY','CIVIL_SERVICE']", message: "ACCESS_REVOKED") {
      accessReady syncStatus membershipStatus adminReady
      securityVersion @check(expr: "this == vars.actorSecurityVersion", message: "SESSION_VERSION_STALE")
      user {membershipStatus}
    }
    managementBooking: booking(id: $bookingId)
      @check(expr: "this != null && ((response.query.currentAuthorization.adminReady && vars.actorIsAdmin) || this.event.section.links.exists(l, type(l.purposes) == list && 'MODERATOR' in l.purposes && (l.userGroup.users.size() > 0 || (type(l.userGroup.membershipStatuses) == list && response.query.currentAuthorization.membershipStatus in l.userGroup.membershipStatuses))))", message: "SECTION_MODERATOR_REQUIRED") {
      event {section {links: sectionUserGroupPurposeLinks_on_section(limit: 1000) {
        purposes userGroup {membershipStatuses users: userUserGroups_on_userGroup(where: {userId: {eq: $reviewedById}}, limit: 1) {userId}}
      }}}
    }
  }

  reviewed: booking_updateMany(
    where: {
      id: { eq: $bookingId }
      revisionGroupId: { eq: $revisionGroupId }
      status: { in: [SUBMITTED, CONFIRMED] }
      approvalStatus: { eq: PENDING }
      supersededAt: { isNull: true }
    }
    data: {
      approvalStatus: APPROVED
      approvalReviewedById: $reviewedById
      approvalReviewedAt_expr: "request.time"
      approvalNote: $approvalNote
      updatedAt_expr: "request.time"
      updatedBy: $reviewedById
    }
  ) @check(expr: "this == 1", message: "BOOKING_APPROVAL_CONFLICT")
  retired: booking_updateMany(
    where: {
      id: { eq: $activeBookingId }
      revisionGroupId: { eq: $revisionGroupId }
      supersededAt: { isNull: true }
      approvalStatus: { in: [NOT_REQUIRED, APPROVED] }
    }
    data: {
      supersededAt_expr: "request.time"
      updatedAt_expr: "request.time"
      updatedBy: $reviewedById
    }
  ) @check(expr: "this == 1", message: "BOOKING_APPROVAL_CONFLICT")
  bookingPaymentAdjustment_upsert(
    data: {
      revisionBookingId: $bookingId
      supersededBookingId: $activeBookingId
      deltaAmountMinor: $deltaAmountMinor
      status: $adjustmentStatus
      orchestrationKey: $orchestrationKey
      createdBy: $reviewedById
      updatedBy: $reviewedById
    }
  )
}

# Checkout orders and their exact place allocations are one unit. Creating
# these rows in separate operations could leave an unallocated order (or an
# allocation without the order) when a retry races a partial failure.
mutation CreateAllocatedTicketOrderFromCallable(
  $orderId: UUID!
  $userId: String!
  $eventId: UUID!
  $ticketTypeId: UUID!
  $quantity: Int!
  $unitAmountMinor: Int!
  $totalAmountMinor: Int!
  $currency: String!
  $status: TicketOrderStatus!
  $webhookEventId: String
  $createdBy: String!
  $updatedBy: String!
  $allocations: [BookingPlacePaymentAllocation_Data!]! @allow(fields: "id ticketOrderId bookingPlaceId allocatedAmountMinor createdBy updatedBy", maxCount: 100)
) @auth(level: NO_ACCESS) @transaction {
  ticketOrder_insert(data: {
    id: $orderId
    userId: $userId
    eventId: $eventId
    ticketTypeId: $ticketTypeId
    quantity: $quantity
    unitAmountMinor: $unitAmountMinor
    totalAmountMinor: $totalAmountMinor
    currency: $currency
    status: $status
    webhookEventId: $webhookEventId
    createdBy: $createdBy
    updatedBy: $updatedBy
  })
  bookingPlacePaymentAllocation_insertMany(data: $allocations)
}
