# Only callables may read these. Section access is checked before fetching names and symposium/dinner flags.
query GetAttendeeEventSection($eventId: UUID!) @auth(level: NO_ACCESS) {
  event(id: $eventId) { section { id } }
}

query GetEventAttendeeNames($eventId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  bookings(
    where: {
      eventId: { eq: $eventId }
      status: { in: [SUBMITTED, CONFIRMED] }
      approvalStatus: { in: [NOT_REQUIRED, APPROVED] }
      supersededAt: { isNull: true }
    }
    orderBy: { id: ASC }
    limit: $limit
    offset: $offset
  ) {
    revisionGroupId
    revisionNumber
    status
    approvalStatus
    supersededAt
    booker { firstName lastName }
    lines: bookingLines_on_booking {
      bookingPlace { attendanceRemoved attendanceName attendanceTicketType { audience includesSymposium includesDinner } }
      guestDisplayName
      guestUser { firstName lastName }
      ticketType { audience includesSymposium includesDinner }
    }
  }
}
