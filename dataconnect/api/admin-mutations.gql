# Guest ticket request emails — request + booker/event context after create or review.
# Scheduled cleanup: stale DRAFT bookings past TTL (issue #235).
query ListStaleDraftBookingsForScheduler(
  $updatedBefore: Timestamp!
  $limit: Int!
) @auth(level: NO_ACCESS) {
  bookings(
    where: {
      status: { eq: DRAFT }
      updatedAt: { lt: $updatedBefore }
    }
    orderBy: { updatedAt: ASC }
    limit: $limit
  ) {
    id
    status
    updatedAt
  }
}

# Scheduled cleanup: unpaid PENDING ticket orders past TTL (issue #235).
query ListStalePendingTicketOrdersForScheduler(
  $createdBefore: Timestamp!
  $limit: Int!
) @auth(level: NO_ACCESS) {
  ticketOrders(
    where: {
      status: { eq: PENDING }
      createdAt: { lt: $createdBefore }
    }
    orderBy: { createdAt: ASC }
    limit: $limit
  ) {
    id
    status
    createdAt
  }
}

query GetGuestTicketRequestForNotification($id: UUID!) @auth(level: NO_ACCESS) {
  guestTicketRequest(id: $id) {
    id
    status
    requestedGuestCount
    dietaryNote
    moderatorNote
    guestTicketType {
      id
      title
      price
    }
    booking {
      id
      booker {
        id
        firstName
        lastName
        email
      }
      event {
        id
        title
        location
        startDateTime
        endDateTime
        section {
          id
          name
        }
      }
      # Every current GuestTicketRequest row represents exactly one guest
      # (requestedGuestCount is always 1), so this is used to aggregate the
      # booking's current total guest-ticket count/cost across all sibling
      # requests, rather than naming one guest per notification.
      guestTicketRequests: guestTicketRequests_on_booking {
        id
        status
        requestedGuestCount
        guestTicketType {
          price
        }
      }
    }
  }
}



