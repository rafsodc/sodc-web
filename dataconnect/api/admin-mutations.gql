# Used by the GOV Notify delivery callback (notifyCallback.ts) to find the recipient row for a
# delivery/bounce receipt. Looked up by (announcementSendId, userId) parsed from the reference
# string set at send time — see #334.
query GetAnnouncementRecipientBySendAndUser($announcementSendId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  announcementRecipients(
    where: { announcementSendId: { eq: $announcementSendId }, userId: { eq: $userId } }
    limit: 1
  ) {
    id
    status
    failureReason
    processingVersion
    processingStartedAt
    providerNotificationId
    effectiveDeliveryMode
    deliveryVersion
    deliveryStatusUpdatedAt
    deliveryReceiptId
  }
}

mutation TryUpdateAnnouncementRecipientProcessingStatus(
  $id: UUID!
  $expectedStatus: String!
  $expectedProcessingVersion: Int!
  $status: String!
  $processingVersion: Int!
  $processingStartedAt: Timestamp
  $sentAt: Timestamp
  $failureReason: String
  $providerNotificationId: String
) @auth(level: NO_ACCESS) {
  announcementRecipient_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: $expectedStatus }
      processingVersion: { eq: $expectedProcessingVersion }
    }
    data: {
      status: $status
      processingVersion: $processingVersion
      processingStartedAt: $processingStartedAt
      sentAt: $sentAt
      failureReason: $failureReason
      providerNotificationId: $providerNotificationId
    }
  )
}

