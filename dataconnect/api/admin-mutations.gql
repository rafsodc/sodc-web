      profileReviewedAt: null
      createdBy: "legacy-migration"
      updatedBy: "legacy-migration"
      createdAt: $now
      updatedAt: $now
    }
  )
  legacyUserIdentity_insert(
    data: {
      sourceSystem: $sourceSystem
      legacyUserId: $legacyUserId
      oldUid: $oldUid
      userId: $userId
      migrationBatchId: $migrationBatchId
