# SODC Admin SDK Mutations
#
# These mutations are SDK-only and use @auth(level: NO_ACCESS).
# They can only be called from Firebase Functions or CLI scripts using the admin SDK.
# They are NOT accessible from the frontend/client SDK.
#
# Auth Expression: @auth(level: NO_ACCESS)
# See AUTH_EXPRESSIONS.md for complete documentation.

# ── GOV.UK Notify site-wide delivery mode ───────────────────────────────────

query GetGovNotifyDeliveryConfiguration @auth(level: NO_ACCESS) {
  govNotifyDeliveryConfiguration(key: { id: "site-wide" }) {
    mode
    version
    updatedAt
    updatedBy
  }
}

query ListGovNotifyDeliveryModeAudits($limit: Int!) @auth(level: NO_ACCESS) {
  govNotifyDeliveryModeAudits(orderBy: { changedAt: DESC }, limit: $limit) {
    id
    previousMode
    newMode
    deploymentCeiling
    changedBy
    reason
    changedAt
  }
}

mutation CreateGovNotifyDeliveryConfiguration @auth(level: NO_ACCESS) {
  govNotifyDeliveryConfiguration_insert(
    data: {
      id: "site-wide"
      mode: SIMULATION
      version: 1
      updatedBy: "system"
    }
  )
}

mutation ChangeGovNotifyDeliveryMode(
  $expectedVersion: Int!
  $previousMode: GovNotifyDeliveryMode!
  $newMode: GovNotifyDeliveryMode!
  $deploymentCeiling: GovNotifyDeliveryMode!
  $changedBy: String!
  $reason: String!
) @auth(level: NO_ACCESS) @transaction {
  changed: govNotifyDeliveryConfiguration_updateMany(
    where: {
      id: { eq: "site-wide" }
      version: { eq: $expectedVersion }
      mode: { eq: $previousMode }
    }
    data: {
      mode: $newMode
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $changedBy
    }
  ) @check(expr: "this == 1", message: "DELIVERY_MODE_CONFLICT")

  govNotifyDeliveryModeAudit_insert(
    data: {
      previousMode: $previousMode
      newMode: $newMode
      deploymentCeiling: $deploymentCeiling
      changedBy: $changedBy
      reason: $reason
    }
  )
}

# ── GOV.UK Notify reply-to configuration ────────────────────────────────────

query GetNotifyReplyToConfiguration @auth(level: NO_ACCESS) {
  notifyEmailConfiguration(key: { id: "site-wide" }) {
    version
    updatedAt
    updatedBy
    defaultReplyToAddress {
      id
      displayLabel
      emailAddress
      notifyUuid
      enabled
      announcementSelectable
      verificationStatus
      providerAcceptedAt
      providerNotificationId
      verificationMode
      verifiedAt
      verifiedBy
      version
      createdAt
      updatedAt
      createdBy
      updatedBy
    }
  }
  notifyReplyToAddresses(orderBy: { displayLabel: ASC }) {
    id
    displayLabel
    emailAddress
    notifyUuid
    enabled
    announcementSelectable
    verificationStatus
    providerAcceptedAt
    providerNotificationId
    verificationMode
    verifiedAt
    verifiedBy
    version
    createdAt
    updatedAt
    createdBy
    updatedBy
  }
  notifyTemplateReplyToOverrides(orderBy: { templateKey: ASC }) {
    templateKey
    replyToAddress {
      id
      displayLabel
      emailAddress
      notifyUuid
      enabled
      verificationStatus
    }
    updatedAt
    updatedBy
  }
}

query ListNotifyReplyToAudits($limit: Int!) @auth(level: NO_ACCESS) {
  notifyReplyToAudits(orderBy: { changedAt: DESC }, limit: $limit) {
    id
    action
    replyToAddressId
    templateKey
    previousValue
    newValue
    changedBy
    reason
    changedAt
  }
}

mutation CreateNotifyEmailConfiguration @auth(level: NO_ACCESS) {
  notifyEmailConfiguration_insert(data: {
    id: "site-wide"
    version: 1
    updatedBy: "system"
  })
}

mutation CreateNotifyReplyToAddress(
  $id: UUID!
  $displayLabel: String!
  $emailAddress: String!
  $notifyUuid: String!
  $changedBy: String!
  $reason: String
  $newValue: String!
) @auth(level: NO_ACCESS) @transaction {
  notifyReplyToAddress_insert(data: {
    id: $id
    displayLabel: $displayLabel
    emailAddress: $emailAddress
    notifyUuid: $notifyUuid
    enabled: false
    announcementSelectable: false
    verificationStatus: UNVERIFIED
    createdBy: $changedBy
    updatedBy: $changedBy
  })
  notifyReplyToAudit_insert(data: {
    action: CREATED
    replyToAddressId: $id
    newValue: $newValue
    changedBy: $changedBy
    reason: $reason
  })
}

mutation UpdateNotifyReplyToAddressIdentity(
  $id: UUID!
  $expectedVersion: Int!
  $displayLabel: String!
  $emailAddress: String!
  $notifyUuid: String!
  $changedBy: String!
  $reason: String
  $previousValue: String!
  $newValue: String!
) @auth(level: NO_ACCESS) @transaction {
  changed: notifyReplyToAddress_updateMany(
    where: { id: { eq: $id }, version: { eq: $expectedVersion } }
    data: {
      displayLabel: $displayLabel
      emailAddress: $emailAddress
      notifyUuid: $notifyUuid
      enabled: false
      announcementSelectable: false
      verificationStatus: UNVERIFIED
      providerAcceptedAt: null
      providerNotificationId: null
      verificationMode: null
      verifiedAt: null
      verifiedBy: null
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $changedBy
    }
  ) @check(expr: "this == 1", message: "REPLY_TO_CONFLICT")
  notifyReplyToAudit_insert(data: {
    action: UPDATED
    replyToAddressId: $id
    previousValue: $previousValue
    newValue: $newValue
    changedBy: $changedBy
    reason: $reason
  })
}

mutation RecordNotifyReplyToProviderAcceptance(
  $id: UUID!
