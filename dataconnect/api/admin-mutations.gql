      enabled: false
      announcementSelectable: false
      verificationStatus: PROVIDER_ACCEPTED
      providerAcceptedAt_expr: "request.time"
      providerNotificationId: $providerNotificationId
      verificationMode: $verificationMode
      verifiedAt: null
      verifiedBy: null
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $changedBy
    }
  ) @check(expr: "this == 1", message: "REPLY_TO_CONFLICT")
  notifyReplyToAudit_insert(data: {
    action: PROVIDER_TEST_ACCEPTED
    replyToAddressId: $id
    newValue: $providerNotificationId
    changedBy: $changedBy
    reason: $reason
  })
}

mutation ConfirmNotifyReplyToVerification(
  $id: UUID!
  $expectedVersion: Int!
  $changedBy: String!
  $reason: String
) @auth(level: NO_ACCESS) @transaction {
  changed: notifyReplyToAddress_updateMany(
    where: {
      id: { eq: $id }
      version: { eq: $expectedVersion }
      verificationStatus: { eq: PROVIDER_ACCEPTED }
    }
    data: {
      verificationStatus: VERIFIED
      verifiedAt_expr: "request.time"
      verifiedBy: $changedBy
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $changedBy
    }
  ) @check(expr: "this == 1", message: "REPLY_TO_CONFLICT")
  notifyReplyToAudit_insert(data: {
    action: VERIFIED
    replyToAddressId: $id
    changedBy: $changedBy
    reason: $reason
  })
}

mutation UpdateNotifyReplyToAvailability(
  $id: UUID!
  $expectedVersion: Int!
  $enabled: Boolean!
  $announcementSelectable: Boolean!
  $changedBy: String!
  $reason: String
  $previousValue: String!
