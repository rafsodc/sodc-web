mutation ChangeNotifyReplyToDefault(
  $expectedVersion: Int!
  $previousAddressId: UUID
  $newAddressId: UUID
  $changedBy: String!
  $reason: String
  $previousValue: String
  $newValue: String
) @auth(level: NO_ACCESS) @transaction {
  changed: notifyEmailConfiguration_updateMany(
    where: {
      id: { eq: "site-wide" }
      version: { eq: $expectedVersion }
      defaultReplyToAddressId: { eq: $previousAddressId }
    }
    data: {
      defaultReplyToAddressId: $newAddressId
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $changedBy
    }
  ) @check(expr: "this == 1", message: "REPLY_TO_DEFAULT_CONFLICT")
  notifyReplyToAudit_insert(data: {
    action: DEFAULT_CHANGED
    replyToAddressId: $newAddressId
    previousValue: $previousValue
    newValue: $newValue
    changedBy: $changedBy
    reason: $reason
  })
}

mutation DisableDefaultNotifyReplyToAddress(
  $id: UUID!
  $expectedAddressVersion: Int!
  $expectedConfigurationVersion: Int!
  $replacementAddressId: UUID
  $changedBy: String!
  $reason: String
  $previousValue: String!
) @auth(level: NO_ACCESS) @transaction {
  addressChanged: notifyReplyToAddress_updateMany(
    where: {
      id: { eq: $id }
      version: { eq: $expectedAddressVersion }
      verificationStatus: { eq: VERIFIED }
    }
    data: {
      enabled: false
      announcementSelectable: false
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $changedBy
    }
  ) @check(expr: "this == 1", message: "REPLY_TO_CONFLICT")
  configurationChanged: notifyEmailConfiguration_updateMany(
    where: {
      id: { eq: "site-wide" }
      version: { eq: $expectedConfigurationVersion }
      defaultReplyToAddressId: { eq: $id }
    }
    data: {
      defaultReplyToAddressId: $replacementAddressId
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $changedBy
    }
  ) @check(expr: "this == 1", message: "REPLY_TO_DEFAULT_CONFLICT")
  notifyReplyToAudit_insert(data: {
    action: DISABLED
    replyToAddressId: $id
    previousValue: $previousValue
    changedBy: $changedBy
    reason: $reason
  })
}

mutation SetNotifyTemplateReplyToOverride(
  $templateKey: String!
  $replyToAddressId: UUID!
  $changedBy: String!
  $reason: String
  $previousValue: String
  $newValue: String!
) @auth(level: NO_ACCESS) @transaction {
  notifyTemplateReplyToOverride_upsert(data: {
    templateKey: $templateKey
    replyToAddressId: $replyToAddressId
    updatedAt_expr: "request.time"
    updatedBy: $changedBy
  })
  notifyReplyToAudit_insert(data: {
    action: TEMPLATE_OVERRIDE_CHANGED
    replyToAddressId: $replyToAddressId
    templateKey: $templateKey
    previousValue: $previousValue
    newValue: $newValue
    changedBy: $changedBy
    reason: $reason
  })
}

mutation ClearNotifyTemplateReplyToOverride(
  $templateKey: String!
  $changedBy: String!
  $reason: String
  $previousValue: String!
) @auth(level: NO_ACCESS) @transaction {
  notifyTemplateReplyToOverride_delete(key: { templateKey: $templateKey })
  notifyReplyToAudit_insert(data: {
    action: TEMPLATE_OVERRIDE_CHANGED
    templateKey: $templateKey
    previousValue: $previousValue
    changedBy: $changedBy
    reason: $reason
  })
}

# ── GOV.UK Notify transactional template bindings ───────────────────────────

query GetNotifyTemplateBindings @auth(level: NO_ACCESS) {
  notifyTemplateBindings {
    templateKey
    notifyTemplateId
    reviewedVersion
    version
    updatedAt
    updatedBy
  }
}

query ListNotifyTemplateBindingAudits($limit: Int!) @auth(level: NO_ACCESS) {
  notifyTemplateBindingAudits(orderBy: { changedAt: DESC }, limit: $limit) {
    id
    action
    templateKey
    previousValue
    newValue
    changedBy
    reason
    changedAt
  }
}

mutation UpsertNotifyTemplateBinding(
  $templateKey: String!
  $notifyTemplateId: String!
  $reviewedVersion: Int!
  $changedBy: String!
  $reason: String
  $auditAction: NotifyTemplateBindingAuditAction!
  $previousValue: String
  $newValue: String!
) @auth(level: NO_ACCESS) @transaction {
  notifyTemplateBinding_upsert(data: {
    templateKey: $templateKey
    notifyTemplateId: $notifyTemplateId
    reviewedVersion: $reviewedVersion
    updatedAt_expr: "request.time"
    updatedBy: $changedBy
  })
  notifyTemplateBindingAudit_insert(data: {
    action: $auditAction
    templateKey: $templateKey
    previousValue: $previousValue
    newValue: $newValue
    changedBy: $changedBy
    reason: $reason
  })
}

# ── Section file storage lifecycle ───────────────────────────────────────────

# The caller generates both the opaque file ID and object path. This makes it
# possible to constrain a direct upload to section-files/{sectionId}/{fileId}/...
# before metadata is inserted. Actual object properties are verified separately
# before FinalizePendingSectionFile makes the file available.
mutation CreatePendingSectionFile(
  $id: UUID!
  $sectionId: UUID!
  $pendingStorageObjectPath: String!
  $displayName: String!
  $originalFilename: String!
  $description: String
  $contentType: String!
  $sizeBytes: Int!
  $uploadedBy: String!
  $now: Timestamp!
) @auth(level: NO_ACCESS) {
  sectionFile_insert(
    data: {
      id: $id
      sectionId: $sectionId
      pendingStorageObjectPath: $pendingStorageObjectPath
      displayName: $displayName
      originalFilename: $originalFilename
      description: $description
      contentType: $contentType
      sizeBytes: $sizeBytes
      status: PENDING
      uploadedBy: $uploadedBy
      createdAt: $now
      updatedAt: $now
      createdBy: $uploadedBy
      updatedBy: $uploadedBy
    }
  )
}

query GetSectionFileById($id: UUID!) @auth(level: NO_ACCESS) {
  sectionFile(id: $id) {
    id
    sectionId
    storageObjectPath
    pendingStorageObjectPath
    pendingOriginalFilename
    pendingContentType
    pendingSizeBytes
    displayName
    originalFilename
    description
    contentType
    sizeBytes
    objectGeneration
    checksumSha256
    status
    uploadedBy
    deletedAt
    createdAt
    updatedAt
  }
}

query ListSectionFilesByStatus(
  $sectionId: UUID!
  $status: SectionFileStatus!
  $limit: Int!
) @auth(level: NO_ACCESS) {
  sectionFiles(
    where: {
      sectionId: { eq: $sectionId }
      status: { eq: $status }
    }
    orderBy: { createdAt: DESC }
    limit: $limit
  ) {
    id
    sectionId
    storageObjectPath
    pendingStorageObjectPath
    displayName
    originalFilename
    description
    contentType
    sizeBytes
    objectGeneration
    checksumSha256
    status
    uploadedBy
    deletedAt
    createdAt
    updatedAt
  }
}

query ListStaleSectionFiles(
  $updatedBefore: Timestamp!
  $limit: Int!
) @auth(level: NO_ACCESS) {
  sectionFiles(
    where: {
      status: { in: [PENDING, REPLACING, DELETING] }
      updatedAt: { lt: $updatedBefore }
    }
    orderBy: { updatedAt: ASC }
    limit: $limit
  ) {
    id
    sectionId
    storageObjectPath
    pendingStorageObjectPath
    status
    updatedAt
  }
}

query ListSectionFilesForQuota($sectionId: UUID!, $limit: Int!) @auth(level: NO_ACCESS) {
  sectionFiles(
    where: {
      sectionId: { eq: $sectionId }
      status: { in: [PENDING, AVAILABLE, REPLACING, DELETING] }
    }
    limit: $limit
  ) {
    id
    sizeBytes
    status
  }
}

mutation RecordSectionFileAudit(
  $sectionId: UUID!
  $fileId: UUID
  $actorUid: String!
  $action: String!
  $outcome: String!
  $detail: String
) @auth(level: NO_ACCESS) {
  sectionFileAudit_insert(data: {
    sectionId: $sectionId
    fileId: $fileId
    actorUid: $actorUid
    action: $action
    outcome: $outcome
    detail: $detail
  })
}

mutation AbandonPendingSectionFile(
  $id: UUID!
  $updatedBefore: Timestamp!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: PENDING }
      updatedAt: { lt: $updatedBefore }
    }
    data: {
      pendingStorageObjectPath: null
      status: DELETED
      deletedAt_expr: "request.time"
      updatedAt_expr: "request.time"
      updatedBy: "section-file-reconciliation"
    }
  )
}

# Compare-and-swap finalization prevents a stale upload from promoting metadata
# after a replacement or deletion transition has started.
mutation FinalizePendingSectionFile(
  $id: UUID!
  $pendingStorageObjectPath: String!
  $storageObjectPath: String!
  $objectGeneration: String!
  $checksumSha256: String!
  $contentType: String!
  $sizeBytes: Int!
  $updatedBy: String!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: PENDING }
      pendingStorageObjectPath: { eq: $pendingStorageObjectPath }
    }
    data: {
      storageObjectPath: $storageObjectPath
      pendingStorageObjectPath: null
      objectGeneration: $objectGeneration
      checksumSha256: $checksumSha256
      contentType: $contentType
      sizeBytes: $sizeBytes
      status: AVAILABLE
      updatedAt_expr: "request.time"
      updatedBy: $updatedBy
    }
  )
}

mutation UpdateAvailableSectionFileMetadata(
  $id: UUID!
  $displayName: String!
  $description: String
  $updatedBy: String!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: AVAILABLE }
    }
    data: {
      displayName: $displayName
      description: $description
      updatedAt_expr: "request.time"
      updatedBy: $updatedBy
    }
  )
}

# A replacement upload uses a different immutable object path. The current
# object metadata remains intact and can continue to be served until promotion.
mutation BeginSectionFileReplacement(
  $id: UUID!
  $pendingStorageObjectPath: String!
  $pendingOriginalFilename: String!
  $pendingContentType: String!
  $pendingSizeBytes: Int!
  $updatedBy: String!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: AVAILABLE }
    }
    data: {
      pendingStorageObjectPath: $pendingStorageObjectPath
      pendingOriginalFilename: $pendingOriginalFilename
      pendingContentType: $pendingContentType
      pendingSizeBytes: $pendingSizeBytes
      status: REPLACING
      updatedAt_expr: "request.time"
      updatedBy: $updatedBy
    }
  )
}

mutation FinalizeSectionFileReplacement(
  $id: UUID!
  $pendingStorageObjectPath: String!
  $storageObjectPath: String!
  $originalFilename: String!
  $objectGeneration: String!
  $checksumSha256: String!
  $contentType: String!
  $sizeBytes: Int!
  $updatedBy: String!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: REPLACING }
      pendingStorageObjectPath: { eq: $pendingStorageObjectPath }
    }
    data: {
      storageObjectPath: $storageObjectPath
      pendingStorageObjectPath: null
      pendingOriginalFilename: null
      pendingContentType: null
      pendingSizeBytes: null
      originalFilename: $originalFilename
      objectGeneration: $objectGeneration
      checksumSha256: $checksumSha256
      contentType: $contentType
      sizeBytes: $sizeBytes
      status: AVAILABLE
      updatedAt_expr: "request.time"
      updatedBy: $updatedBy
    }
  )
}

mutation AbortSectionFileReplacement(
  $id: UUID!
  $pendingStorageObjectPath: String!
  $updatedBy: String!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: REPLACING }
      pendingStorageObjectPath: { eq: $pendingStorageObjectPath }
    }
    data: {
      pendingStorageObjectPath: null
      pendingOriginalFilename: null
      pendingContentType: null
      pendingSizeBytes: null
      status: AVAILABLE
      updatedAt_expr: "request.time"
      updatedBy: $updatedBy
    }
  )
}

mutation BeginSectionFileDeletion(
  $id: UUID!
  $updatedBy: String!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { in: [AVAILABLE, REPLACING] }
    }
    data: {
      status: DELETING
      updatedAt_expr: "request.time"
      updatedBy: $updatedBy
    }
  )
}

mutation MarkSectionFileDeleted(
  $id: UUID!
  $deletedAt: Timestamp!
  $updatedBy: String!
) @auth(level: NO_ACCESS) {
  sectionFile_updateMany(
    where: {
      id: { eq: $id }
      status: { eq: DELETING }
    }
    data: {
      status: DELETED
      deletedAt: $deletedAt
      pendingStorageObjectPath: null
      pendingOriginalFilename: null
      pendingContentType: null
      pendingSizeBytes: null
      updatedAt: $deletedAt
      updatedBy: $updatedBy
    }
  )
}

# Update user membership status (SDK only)
# Used by Firebase Functions to update membership status with server-side validation
mutation UpdateUserMembershipStatus($userId: String!, $membershipStatus: MembershipStatus!) @auth(level: NO_ACCESS) {
  user_update(
    id: $userId
    data: { 
      membershipStatus: $membershipStatus
      updatedAt_expr: "request.time"
      updatedBy: "system"
    }
  )
}

# Reconcile profile email after Firebase has completed a verified email change.
# The callable supplies both values from the Firebase Auth user record.
mutation UpdateUserEmailFromAuth($userId: String!, $email: String!) @auth(level: NO_ACCESS) {
  user_update(
    id: $userId
    data: {
      email: $email
      updatedAt_expr: "request.time"
      updatedBy: "system"
    }
  )
}

# Delete a user (SDK only)
# Used by Firebase Functions/CLI for dev reset operations
mutation DeleteUser($userId: String!) @auth(level: NO_ACCESS) {
  user_delete(id: $userId)
}

# Create a user profile (SDK only)
# Used by Firebase Functions/CLI to create user profiles
# This mutation works with service account credentials (no user auth token required)
# Note: All fields with default expressions referencing auth.uid must be set explicitly
# since auth.uid is not available in NO_ACCESS context
mutation CreateUser(
  $userId: String!
  $firstName: String!
  $lastName: String!
  $email: String!
  $serviceNumber: String!
  $mobileNumber: String
  $postNominals: String
  $membershipStatus: MembershipStatus!
  $isRegular: Boolean
  $isReserve: Boolean
  $isCivilServant: Boolean
  $isIndustry: Boolean
  $now: Timestamp!
) @auth(level: NO_ACCESS) {
  user_upsert(
    data: {
      id: $userId
      firstName: $firstName
      lastName: $lastName
      email: $email
      serviceNumber: $serviceNumber
      mobileNumber: $mobileNumber
      postNominals: $postNominals
      requestedMembershipStatus: $membershipStatus
      membershipStatus: $membershipStatus
      isRegular: $isRegular
      isReserve: $isReserve
      isCivilServant: $isCivilServant
      isIndustry: $isIndustry
      createdBy: "system"
      updatedBy: "system"
      createdAt: $now
      updatedAt: $now
    }
  )
}

# ── Legacy-user migration ────────────────────────────────────────────────────

# Creates only new profiles. insert (rather than upsert) deliberately fails if
# the canonical user already exists so a migration cannot overwrite it.
mutation CreateMigratedUserProfileAndIdentity(
  $userId: String!
  $legacyUserId: UUID!
  $oldUid: Int
  $sourceSystem: String!
  $migrationBatchId: UUID!
  $recordSchemaVersion: String!
  $sourceChecksum: String!
  $firstName: String!
  $lastName: String!
  $email: String!
  $serviceNumber: String!
  $mobileNumber: String
  $postNominals: String
  $rank: String!
  $membershipStatus: MembershipStatus!
  $shareContactInfo: Boolean!
  $announcementOptOutAll: Boolean!
  $legacyPasswordMigrated: Boolean
  $now: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  user_insert(
