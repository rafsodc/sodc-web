# ── Rate limiting (functions/src/rateLimiter.ts) ─────────────────────────────

# Legacy operations retained for a safe connector-first rollout of #369.
query GetCallableInvocation($userId: String!, $functionName: String!) @auth(level: NO_ACCESS) {
  callableInvocation(key: { userId: $userId, functionName: $functionName }) {
    windowStart
    count
  }
}

mutation UpsertCallableInvocation(
  $userId: String!
  $functionName: String!
  $windowStart: Timestamp!
  $count: Int!
) @auth(level: NO_ACCESS) {
  callableInvocation_upsert(
    data: { userId: $userId, functionName: $functionName, windowStart: $windowStart, count: $count }
  )
}

## Ensures the current window's bucket row exists before ConsumeCallableRateLimit
## conditionally increments it. Kept as its own operation, and always committed
## before ConsumeCallableRateLimit runs: a row created by callableRateLimitBucket_upsert
## in the SAME transaction as a subsequent callableRateLimitBucket_updateMany's `where`
## filter is not visible to that filter, so the two cannot be combined into one
## @transaction (see #401 — this previously made every rate-limited callable reject
## every request, because @transaction rolls the upsert back too when the update's
## affected-row @check fails).
mutation EnsureCallableRateLimitBucket(
  $userId: String!
  $functionName: String!
  $windowStart: Timestamp!
) @auth(level: NO_ACCESS) {
  callableRateLimitBucket_upsert(
    data: {
      userId: $userId
      functionName: $functionName
      windowStart: $windowStart
    }
  )
}

mutation ConsumeCallableRateLimit(
  $userId: String!
  $functionName: String!
  $windowStart: Timestamp!
  $limit: Int!
) @auth(level: NO_ACCESS) @transaction {
  consumed: callableRateLimitBucket_updateMany(
    where: {
      userId: { eq: $userId }
      functionName: { eq: $functionName }
      windowStart: { eq: $windowStart }
      count: { lt: $limit }
    }
    data: { count_update: { inc: 1 } }
  ) @check(expr: "this == 1", message: "RATE_LIMIT_EXCEEDED")

  callableRateLimitBucket_deleteMany(
    where: {
      userId: { eq: $userId }
      functionName: { eq: $functionName }
      windowStart: { lt: $windowStart }
    }
  )
}
