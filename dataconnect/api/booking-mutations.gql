# Booking cleanup mutations used by the admin event cascade-delete flow. Member
# booking writes are owned by the atomic booking-service connector.

mutation AdminDeleteBookingLine($id: UUID!) @auth(expr: "auth.token.admin == true && auth.token.enabled == true") @transaction {
  query @redact {
  currentAuthorization: userSecurityState(key: {userId_expr: "auth.uid"}) @redact
    @check(expr: "this != null && this.accessReady == true && this.syncStatus == 'READY' && this.membershipStatus == this.user.membershipStatus", message: "ACCESS_REVOKED") {
    syncStatus
    securityVersion @check(expr: "has(auth.token.securityVersion) && this == auth.token.securityVersion", message: "SESSION_VERSION_STALE")
    accessReady
    membershipStatus
    adminReady @check(expr: "this == true", message: "ACCESS_REVOKED")
    user { membershipStatus @check(expr: "this in ['REGULAR', 'RETIRED', 'RESERVE', 'INDUSTRY', 'CIVIL_SERVICE']", message: "ACCESS_REVOKED") }
  }
  }

  bookingLine_delete(id: $id)
}

mutation AdminDeleteBooking($id: UUID!) @auth(expr: "auth.token.admin == true && auth.token.enabled == true") @transaction {
  query @redact {
  currentAuthorization: userSecurityState(key: {userId_expr: "auth.uid"}) @redact
    @check(expr: "this != null && this.accessReady == true && this.syncStatus == 'READY' && this.membershipStatus == this.user.membershipStatus", message: "ACCESS_REVOKED") {
    syncStatus
    securityVersion @check(expr: "has(auth.token.securityVersion) && this == auth.token.securityVersion", message: "SESSION_VERSION_STALE")
    accessReady
    membershipStatus
    adminReady @check(expr: "this == true", message: "ACCESS_REVOKED")
    user { membershipStatus @check(expr: "this in ['REGULAR', 'RETIRED', 'RESERVE', 'INDUSTRY', 'CIVIL_SERVICE']", message: "ACCESS_REVOKED") }
  }
  }

  booking_delete(id: $id)
}

mutation ResolvePaymentReconciliationException(
  $id: UUID!
  $note: String
) @auth(expr: "auth.token.admin == true && auth.token.enabled == true") @transaction {
  query @redact {
  currentAuthorization: userSecurityState(key: {userId_expr: "auth.uid"}) @redact
    @check(expr: "this != null && this.accessReady == true && this.syncStatus == 'READY' && this.membershipStatus == this.user.membershipStatus", message: "ACCESS_REVOKED") {
    syncStatus
    securityVersion @check(expr: "has(auth.token.securityVersion) && this == auth.token.securityVersion", message: "SESSION_VERSION_STALE")
    accessReady
    membershipStatus
    adminReady @check(expr: "this == true", message: "ACCESS_REVOKED")
    user { membershipStatus @check(expr: "this in ['REGULAR', 'RETIRED', 'RESERVE', 'INDUSTRY', 'CIVIL_SERVICE']", message: "ACCESS_REVOKED") }
  }
  }

  paymentReconciliationException_update(
    id: $id
    data: {
      status: RESOLVED
      note: $note
      ownerUserId_expr: "auth.uid"
      lastAttemptedAt_expr: "request.time"
      resolvedAt_expr: "request.time"
      updatedAt_expr: "request.time"
      updatedBy_expr: "auth.uid"
    }
  )
}
