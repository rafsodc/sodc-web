query ListPotentialLostProfiles($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  users(orderBy: { id: ASC }, limit: $limit, offset: $offset) {
    id firstName lastName email membershipStatus updatedAt
    emailBounceCount emailLastBounceAt emailDeliveryVersion
  }
}

query GetPotentialLostProfile($id: String!) @auth(level: NO_ACCESS) {
  user(id: $id) {
    id firstName lastName email membershipStatus updatedAt
    emailBounceCount emailLastBounceAt emailDeliveryVersion
  }
}

# Readiness/status changes use ConfirmPotentialLostWithAdminSafety in the isolated
# authorization-service connector. Legacy writers exist only in the explicit rollout artifact.
