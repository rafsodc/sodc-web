query GetAnnouncementAttendeeBookings($eventId: UUID!, $offset: Int!) @auth(level: NO_ACCESS) {
  bookings(where: { eventId: { eq: $eventId }, status: { in: [SUBMITTED, CONFIRMED] },
    approvalStatus: { in: [APPROVED, NOT_REQUIRED] }, supersededAt: { isNull: true } },
    orderBy: { id: ASC }, limit: 500, offset: $offset) {
    id revisionGroupId revisionNumber approvalStatus accommodationRequested
    booker { id firstName lastName email rank membershipStatus serviceNumber }
    lines: bookingLines_on_booking(limit: 100) {
      id guestDisplayName
      guestUser { id firstName lastName email rank membershipStatus serviceNumber }
      ticketType { title audience price includesDinner includesSymposium }
      bookingPlace {
        attendanceRemoved attendanceName attendanceAccommodationRequested
        attendanceTicketType { title includesDinner includesSymposium }
        paymentAllocations: bookingPlacePaymentAllocations_on_bookingPlace(limit: 1000) {
          allocatedAmountMinor refundedAmountMinor ticketOrderId
        }
      }
    }
  }
}
query GetAnnouncementAttendeeOrders($eventId: UUID!, $offset: Int!) @auth(level: NO_ACCESS) {
  ticketOrders(where: { eventId: { eq: $eventId } }, orderBy: { id: ASC }, limit: 500, offset: $offset) { id status }
}
