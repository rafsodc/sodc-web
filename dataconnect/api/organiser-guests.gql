query GetPublicOrganiserGuestAttendance($eventId: UUID!, $offset: Int!)
@auth(level: NO_ACCESS) {
  organiserGuests(
    where: { eventId: { eq: $eventId }, cancelledAt: { isNull: true } }
    orderBy: { id: ASC }
    limit: 500
    offset: $offset
  ) {
    firstName
    lastName
    includesSymposium
    includesDinner
  }
}
mutation CreateOrganiserGuest(
  $id: UUID!
  $eventId: UUID!
  $ticketTypeId: UUID!
  $firstName: String!
  $lastName: String!
  $email: String
  $dietaryRequirements: String!
  $priceMinor: Int!
  $includesSymposium: Boolean!
  $includesDinner: Boolean!
  $tokenHash: String!
  $checkoutKey: String!
  $actor: String!
) @auth(level: NO_ACCESS) @transaction {
  organiserGuest_insert(
    data: {
      id: $id
      eventId: $eventId
      standardTicketTypeId: $ticketTypeId
      firstName: $firstName
      lastName: $lastName
      email: $email
      dietaryRequirements: $dietaryRequirements
      priceMinor: $priceMinor
      includesSymposium: $includesSymposium
      includesDinner: $includesDinner
      tokenHash: $tokenHash
      checkoutKey: $checkoutKey
      createdBy: $actor
      updatedBy: $actor
    }
  )
  organiserGuestAudit_insert(
    data: { guestId: $id, action: "CREATED", actor: $actor }
  )
}
# Retained for functions from the previous deployment.
mutation UpdateOrganiserGuestDetails(
  $id: UUID!
  $version: Int!
  $firstName: String!
  $lastName: String!
  $email: String
  $dietaryRequirements: String!
  $actor: String!
) @auth(level: NO_ACCESS) @transaction {
  organiserGuest_updateMany(
    where: {
      id: { eq: $id }
      version: { eq: $version }
      cancelledAt: { isNull: true }
    }
    data: {
      firstName: $firstName
      lastName: $lastName
      email: $email
      dietaryRequirements: $dietaryRequirements
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $actor
    }
  ) @check(expr: "this == 1", message: "GUEST_CONFLICT")
  organiserGuestAudit_insert(
    data: { guestId: $id, action: "DETAILS_UPDATED", actor: $actor }
  )
}

mutation AmendOrganiserGuestDetails(
  $id: UUID!
  $version: Int!
  $firstName: String!
  $lastName: String!
  $email: String
  $dietaryRequirements: String!
  $actor: String!

  $amendmentId: UUID!
  $amendmentRequestHash: String!
  $amendmentPayload: String!
  $amendmentTokenHash: String
  $amendmentNotificationStatus: String!
) @auth(level: NO_ACCESS) @transaction {
  organiserGuest_updateMany(
    where: {
      id: { eq: $id }
      version: { eq: $version }
      cancelledAt: { isNull: true }
    }
    data: {
      firstName: $firstName
      lastName: $lastName
      email: $email
      dietaryRequirements: $dietaryRequirements
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $actor
    }
  ) @check(expr: "this == 1", message: "GUEST_CONFLICT")
  organiserGuestAudit_insert(
    data: { guestId: $id, action: "DETAILS_UPDATED", actor: $actor }
  )

  organiserGuestAmendment_insert(data: {
    id: $amendmentId
    guestId: $id
    requestHash: $amendmentRequestHash
    payload: $amendmentPayload
    tokenHash: $amendmentTokenHash
    notificationStatus: $amendmentNotificationStatus
    createdBy: $actor
  })
}
mutation UpdateOrganiserGuestDietary(
  $id: UUID!
  $version: Int!
  $tokenHash: String!
  $dietaryRequirements: String!
) @auth(level: NO_ACCESS) @transaction {
  organiserGuest_updateMany(
    where: {
      id: { eq: $id }
      version: { eq: $version }
      tokenHash: { eq: $tokenHash }
      cancelledAt: { isNull: true }
      event: { bookingEndDateTime: { gt_expr: "request.time" } }
    }
    data: {
      dietaryRequirements: $dietaryRequirements
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: "guest-link"
    }
  ) @check(expr: "this == 1", message: "GUEST_CONFLICT")
  organiserGuestAudit_insert(
    data: { guestId: $id, action: "DIETARY_UPDATED", actor: "guest-link" }
  )
}
mutation RotateOrganiserGuestLink(
  $id: UUID!
  $version: Int!
  $tokenHash: String!
  $checkoutKey: String!
  $actor: String!
) @auth(level: NO_ACCESS) @transaction {
  organiserGuest_updateMany(
    where: { id: { eq: $id }, version: { eq: $version } }
    data: {
      tokenHash: $tokenHash
      checkoutKey: $checkoutKey
      version_update: { inc: 1 }
      updatedAt_expr: "request.time"
      updatedBy: $actor
    }
  ) @check(expr: "this == 1", message: "GUEST_CONFLICT")
  organiserGuestAudit_insert(
    data: { guestId: $id, action: "LINK_REPLACED", actor: $actor }
  )
  organiserGuestAmendment_updateMany(where: { guestId: { eq: $id } }, data: { tokenHash: null })
}
