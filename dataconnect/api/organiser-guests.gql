  organiserGuestAudit_insert(data: { guestId: $id, action: "TICKET_REASSIGNED", actor: $actor })
}

mutation AmendOrganiserGuestTicket($id: UUID!, $version: Int!, $ticketTypeId: UUID!, $firstName: String!, $lastName: String!, $email: String, $dietaryRequirements: String!, $priceMinor: Int!, $paidAmountMinor: Int, $includesSymposium: Boolean!, $includesDinner: Boolean!, $checkoutKey: String!, $actor: String!
  $amendmentId: UUID!
  $amendmentRequestHash: String!
  $amendmentPayload: String!
  $amendmentTokenHash: String
  $amendmentNotificationStatus: String!
) @auth(level: NO_ACCESS) @transaction {
  organiserGuest_updateMany(where: { id: { eq: $id }, version: { eq: $version }, cancelledAt: { isNull: true } }, data: { standardTicketTypeId: $ticketTypeId, ticketTypeId: null, firstName: $firstName, lastName: $lastName, email: $email, dietaryRequirements: $dietaryRequirements, priceMinor: $priceMinor, paidAmountMinor: $paidAmountMinor, includesSymposium: $includesSymposium, includesDinner: $includesDinner, checkoutKey: $checkoutKey, stripeSessionId: null, version_update: { inc: 1 }, updatedBy: $actor, updatedAt_expr: "request.time" }) @check(expr: "this == 1", message: "GUEST_CONFLICT")
