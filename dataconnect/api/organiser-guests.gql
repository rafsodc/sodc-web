query GetOrganiserGuestEvent($eventId: UUID!) @auth(level: NO_ACCESS) {
  event(id: $eventId) {
    id
    title
    bookingEndDateTime
    section {
      id
    }
  }
}
query ListOrganiserGuestTypes($eventId: UUID!, $offset: Int!)
@auth(level: NO_ACCESS) {
  ticketTypes(
    where: { eventId: { eq: $eventId }, audience: { eq: ORGANISER_GUEST } }
    orderBy: { id: ASC }
    limit: 500
    offset: $offset
  ) {
    id
    title
    description
    sortOrder
    price
    includesSymposium
    includesDinner
    userGroup { id name }
  }
}
query GetOrganiserGuestType($id: UUID!, $eventId: UUID!) @auth(level: NO_ACCESS) {
  ticketTypes(
    where: {
      id: { eq: $id }
      eventId: { eq: $eventId }
      audience: { eq: ORGANISER_GUEST }
    }
    limit: 1
  ) {
    id
    title
    description
    sortOrder
    price
    includesSymposium
    includesDinner
    userGroup { id name }
  }
}
query ListOrganiserGuests($eventId: UUID!, $offset: Int!)
@auth(level: NO_ACCESS) {
  organiserGuests(
    where: { eventId: { eq: $eventId } }
    orderBy: { id: ASC }
    limit: 500
    offset: $offset
  ) {
    id
    firstName
    lastName
    email
    dietaryRequirements
    priceMinor
    includesSymposium
    includesDinner
    version
    checkoutKey
    stripeSessionId
    stripePaymentIntentId
    paidAt
    refundedAmountMinor
    refundPendingMinor
    cancelledAt
    createdBy
    updatedAt
    ticketType {
      id
      title
    }
    standardTicketType {
      id
      title
    }
    event {
      id
      title
      bookingEndDateTime
      section {
        id
      }
    }
  }
}
