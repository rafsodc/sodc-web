mutation AttachOrganiserGuestAdditionalCheckout($id: UUID!, $guestId: UUID!, $checkoutKey: String!, $sessionId: String!, $amountMinor: Int!) @auth(level: NO_ACCESS) @transaction {
  organiserGuest_updateMany(where: { id: { eq: $guestId }, checkoutKey: { eq: $checkoutKey }, cancelledAt: { isNull: true } }, data: { stripeSessionId: $sessionId }) @check(expr: "this == 1", message: "GUEST_CONFLICT")
  organiserGuestPayment_insert(data: { id: $id, guestId: $guestId, amountMinor: $amountMinor, checkoutKey: $checkoutKey, stripeSessionId: $sessionId, createdBy: "system", updatedBy: "system" })
}

mutation MarkOrganiserGuestAdditionalPaymentPaid($id: UUID!, $guestId: UUID!, $sessionId: String!, $paymentIntentId: String!) @auth(level: NO_ACCESS) @transaction {
  organiserGuestPayment_updateMany(where: { id: { eq: $id }, guestId: { eq: $guestId }, stripeSessionId: { eq: $sessionId }, paidAt: { isNull: true } }, data: { stripePaymentIntentId: $paymentIntentId, paidAt_expr: "request.time", updatedAt_expr: "request.time", updatedBy: "stripe" }) @check(expr: "this == 1", message: "GUEST_CONFLICT")
  organiserGuest_update(id: $guestId, data: { version_update: { inc: 1 }, updatedAt_expr: "request.time", updatedBy: "stripe" })
  organiserGuestAudit_insert(data: { guestId: $guestId, action: "ADDITIONAL_PAYMENT_PAID", actor: "stripe" })
}

mutation MarkOrganiserGuestAdditionalPaymentRefunded($id: UUID!, $paymentIntentId: String!, $refundedAmountMinor: Int!, $refundPendingMinor: Int!, $refundFailureReason: String, $stripeRefundId: String) @auth(level: NO_ACCESS) @transaction {
  organiserGuestPayment_updateMany(where: { id: { eq: $id }, stripePaymentIntentId: { eq: $paymentIntentId }, refundedAmountMinor: { le: $refundedAmountMinor } }, data: { refundedAmountMinor: $refundedAmountMinor, refundPendingMinor: $refundPendingMinor, refundFailureReason: $refundFailureReason, stripeRefundId: $stripeRefundId, updatedAt_expr: "request.time", updatedBy: "stripe" }) @check(expr: "this == 1", message: "GUEST_CONFLICT")
}

query GetOrganiserGuestAmendment($id: UUID!) @auth(level: NO_ACCESS) {
  organiserGuestAmendment(id: $id) {
    id guestId requestHash payload tokenHash notificationStatus createdBy
  }
}
query GetOrganiserGuestAmendmentByToken($tokenHash: String!) @auth(level: NO_ACCESS) {
  organiserGuestAmendments(where: { tokenHash: { eq: $tokenHash } }, limit: 1) {
    guestId
  }
}
query ListPendingOrganiserGuestAmendments($before: Timestamp!, $limit: Int!) @auth(level: NO_ACCESS) {
  organiserGuestAmendments(where: { notificationStatus: { eq: "PENDING" }, createdAt: { lt: $before } }, orderBy: { createdAt: ASC }, limit: $limit) {
    id
  }
}
mutation SetOrganiserGuestAmendmentNotificationStatus($id: UUID!, $status: String!) @auth(level: NO_ACCESS) {
  organiserGuestAmendment_updateMany(where: { id: { eq: $id }, notificationStatus: { ne: "SENT" } }, data: { notificationStatus: $status })
}
