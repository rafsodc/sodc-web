# --- Event mutations (current section moderator or global administrator) ---

mutation CreateEvent(
  $sectionId: UUID!
  $title: String!
  $location: String
  $guestOfHonour: String
  $sponsors: String
  $details: String
  $startDateTime: Timestamp!
  $endDateTime: Timestamp!
  $bookingStartDateTime: Timestamp!
  $bookingEndDateTime: Timestamp!
  $maxGuestsWithoutModeratorApproval: Int!
) @auth(expr: "auth.token.enabled == true") @transaction {
  query @redact {
  currentAuthorization: userSecurityState(key: {userId_expr: "auth.uid"}) @redact
    @check(expr: "this != null && this.accessReady == true && this.syncStatus == 'READY' && this.membershipStatus == this.user.membershipStatus", message: "ACCESS_REVOKED") {
    syncStatus
    securityVersion @check(expr: "has(auth.token.securityVersion) && this == auth.token.securityVersion", message: "SESSION_VERSION_STALE")
    accessReady
    membershipStatus
    adminReady
    user { membershipStatus @check(expr: "this in ['REGULAR', 'RETIRED', 'RESERVE', 'INDUSTRY', 'CIVIL_SERVICE']", message: "ACCESS_REVOKED") }
  }
  managementScope: section(id: $sectionId) @redact @check(expr: "this != null && ((response.query.currentAuthorization.adminReady && has(auth.token.admin) && auth.token.admin == true) || this.purposeLinks.exists(l, type(l.purposes) == list && 'MODERATOR' in l.purposes && (l.userGroup.users.size() > 0 || (type(l.userGroup.membershipStatuses) == list && response.query.currentAuthorization.membershipStatus in l.userGroup.membershipStatuses))))", message: "SECTION_MODERATOR_REQUIRED") {
      id
      purposeLinks: sectionUserGroupPurposeLinks_on_section(limit: 1000) {
        purposes
        userGroup {
          membershipStatuses
          users: userUserGroups_on_userGroup(where: {userId: {eq_expr: "auth.uid"}}, limit: 1) {userId}
        }
      }
  }

  }

  event_insert(
    data: {
      sectionId: $sectionId
      title: $title
      location: $location
      guestOfHonour: $guestOfHonour
      sponsors: $sponsors
      details: $details
      startDateTime: $startDateTime
      endDateTime: $endDateTime
      bookingStartDateTime: $bookingStartDateTime
      bookingEndDateTime: $bookingEndDateTime
      maxGuestsWithoutModeratorApproval: $maxGuestsWithoutModeratorApproval
    }
  )
}

