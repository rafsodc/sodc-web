# SODC User Group and Section Mutations
#
# Mutations related to sections, user groups, and access control.
# These mutations are accessible from the frontend/client SDK and require admin authentication.
#
# Auth Expression Constants:
# - Admin access: "auth.token.admin == true && auth.token.enabled == true"
# See AUTH_EXPRESSIONS.md for complete documentation and usage.

# Create a new section (admin only - admins must also be enabled)
mutation CreateSection(
  $name: String!
  $type: SectionType!
  $description: String
) @auth(expr: "auth.token.admin == true && auth.token.enabled == true") @transaction {
  query @redact {
  currentAuthorization: userSecurityState(key: {userId_expr: "auth.uid"}) @redact
    @check(expr: "this != null && this.accessReady == true && this.syncStatus == 'READY' && this.membershipStatus == this.user.membershipStatus", message: "ACCESS_REVOKED") {
    syncStatus
    securityVersion @check(expr: "has(auth.token.securityVersion) && this == auth.token.securityVersion", message: "SESSION_VERSION_STALE")
    accessReady
    membershipStatus
    adminReady @check(expr: "this == true", message: "ACCESS_REVOKED")
    user { membershipStatus @check(expr: "this in ['REGULAR', 'RETIRED', 'RESERVE', 'INDUSTRY', 'CIVIL_SERVICE']", message: "ACCESS_REVOKED") }
  }
  }

  section_insert(
    data: {
      name: $name
      type: $type
      description: $description
    }
  )
}

