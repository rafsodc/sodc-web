          users: userUserGroups_on_userGroup(where: {userId: {eq_expr: "auth.uid"}}, limit: 1) {userId}
        }
      } }
  }

  }

  event_deleteMany(
    where: {
      id: { eq: $id }
      bookingPlaces_on_event: { count: { eq: 0 } }
      ticketOrders_on_event: { count: { eq: 0 } }
      organiserGuests_on_event: { count: { eq: 0 } }
    }
  ) @check(expr: "this == 1", message: "EVENT_HAS_TICKETS")
}

# --- TicketType mutations (current section moderator or global administrator) ---

mutation CreateTicketType(
  $eventId: UUID!
  $userGroupId: UUID!
  $audience: TicketAudience!
  $title: String!
  $description: String
  $price: Float!
  $includesDinner: Boolean!
  $includesSymposium: Boolean!
  $sortOrder: Int
) @auth(expr: "auth.token.enabled == true") @transaction {
  query @redact {
  currentAuthorization: userSecurityState(key: {userId_expr: "auth.uid"}) @redact
    @check(expr: "this != null && this.accessReady == true && this.syncStatus == 'READY' && this.membershipStatus == this.user.membershipStatus", message: "ACCESS_REVOKED") {
    syncStatus
    securityVersion @check(expr: "has(auth.token.securityVersion) && this == auth.token.securityVersion", message: "SESSION_VERSION_STALE")
    accessReady
    membershipStatus
    adminReady
    user { membershipStatus @check(expr: "this in ['REGULAR', 'RETIRED', 'RESERVE', 'INDUSTRY', 'CIVIL_SERVICE']", message: "ACCESS_REVOKED") }
  }
  managementScope: event(id: $eventId) @redact @check(expr: "this != null && ((response.query.currentAuthorization.adminReady && has(auth.token.admin) && auth.token.admin == true) || this.section.purposeLinks.exists(l, type(l.purposes) == list && 'MODERATOR' in l.purposes && (l.userGroup.users.size() > 0 || (type(l.userGroup.membershipStatuses) == list && response.query.currentAuthorization.membershipStatus in l.userGroup.membershipStatuses))))", message: "SECTION_MODERATOR_REQUIRED") {
      id section { id
      purposeLinks: sectionUserGroupPurposeLinks_on_section(limit: 1000) {
        purposes
        userGroup {
          membershipStatuses
          users: userUserGroups_on_userGroup(where: {userId: {eq_expr: "auth.uid"}}, limit: 1) {userId}
        }
      } }
  }

  audienceGroup: userGroup(id: $userGroupId) @redact
    @check(expr: "this != null && (this.links.exists(l, l.sectionId == response.query.managementScope.section.id) || this.tickets.exists(t, t.event.sectionId == response.query.managementScope.section.id))", message: "SECTION_TICKET_GROUP_REQUIRED") {
    links: sectionUserGroupPurposeLinks_on_userGroup(limit: 1000) { sectionId }
    tickets: ticketTypes_on_userGroup(limit: 1000) { event { sectionId } }
  }

  }

  ticketType_insert(
    data: {
      eventId: $eventId
      userGroupId: $userGroupId
      audience: $audience
      title: $title
      description: $description
      price: $price
      includesDinner: $includesDinner
      includesSymposium: $includesSymposium
      sortOrder: $sortOrder
    }
  )
}

